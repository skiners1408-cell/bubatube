name: YouTube to Google Drive Auto-Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 1. Загрузка файлов репозитория
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" FETCH_HEAD

      - name: 2. Установка yt-dlp, FFmpeg, Deno и Rclone
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg rclone unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          python3 -m pip install --upgrade pip "yt-dlp[default]"

      - name: 3. Диагностика настроек и подключение Google Диска
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -f "channels.txt.txt" ]; then
            mv "channels.txt.txt" "channels.txt"
          fi
          touch channels.txt archive.txt

          CH_COUNT=$(grep -cve '^\s*$' channels.txt || true)
          AR_COUNT=$(grep -cve '^\s*$' archive.txt || true)
          echo "=========================================="
          echo "Найдено каналов в channels.txt: $CH_COUNT"
          echo "Записей в archive.txt: $AR_COUNT"
          echo "=========================================="

          if [ "$CH_COUNT" -eq 0 ]; then
            echo "❌ ОШИБКА: Файл channels.txt пуст или не загружен в репозиторий!"
            exit 1
          fi

          if [ -z "$GDRIVE_TOKEN" ]; then
            echo "❌ ОШИБКА: Секрет GDRIVE_TOKEN не задан в Settings -> Secrets -> Actions!"
            exit 1
          fi

          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "✅ Куки YT_COOKIES успешно подключены."
          else
            echo "⚠️ ВНИМАНИЕ: Секрет YT_COOKIES пуст! YouTube может блокировать скачивание с серверов GitHub."
          fi

          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          root_folder_id = 1rBiYAU3gJyX4cglZeYiWLl0NqgtD9qzC
          token = $GDRIVE_TOKEN
          EOF

      - name: 4. Подготовка списка каналов
        run: |
          python3 - << 'EOF'
          import re
          with open('channels.txt', 'r', encoding='utf-8', errors='ignore') as f:
              lines = [l.strip() for l in f if l.strip()]
          fixed = []
          for u in lines:
              u = re.sub(r'\?.*$', '', u).rstrip('/')
              u = re.sub(r'/(videos|shorts|streams|live|featured)$', '', u)
              if re.search(r'youtube\.com/(@[^/]+|channel/[^/]+|c/[^/]+|user/[^/]+)$', u):
                  u += '/videos'
              fixed.append(u)
          fixed.reverse()
          with open('channels_rev.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(fixed) + '\n')
          print(f"Подготовлено ссылок для скачивания: {len(fixed)}")
          EOF

      - name: 5. Скачивание новых видео с YouTube
        run: |
          mkdir -p DOWNLOADS
          COOKIE_ARG=""
          if [ -s cookies.txt ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          yt-dlp $COOKIE_ARG \
            -a "channels_rev.txt" \
            --playlist-end 2 \
            --match-filter "!is_members_only & !is_live & !was_live" \
            --no-write-playlist-metafiles \
            --no-overwrites \
            --geo-bypass \
            --socket-timeout 30 \
            --retries 5 \
            -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720]" \
            --merge-output-format mp4 \
            --write-thumbnail \
            --convert-thumbnails jpg \
            --write-info-json \
            --write-comments \
            --extractor-args "youtube:player_client=tv,mweb,web;comment_sort=top;max_comments=100,25,100" \
            --sponsorblock-remove all \
            --download-archive "archive.txt" \
            --ignore-errors \
            -o "DOWNLOADS/%(uploader)s/%(upload_date)s - %(title)s.%(ext)s" || true

      - name: 6. Отгрузка скачанных видео на Google Диск
        if: always()
        run: |
          if [ -d "DOWNLOADS" ] && [ "$(ls -A DOWNLOADS)" ]; then
            echo "📦 Найдены новые файлы! Отправляю на Google Диск..."
            rclone copy DOWNLOADS gdrive: --transfers 4 --checkers 8 --stats 10s -v
          else
            echo "ℹ️ Папка DOWNLOADS пуста — новых видео не скачано (проверьте лог Шага 5 выше)."
          fi

      - name: 7. Сохранение обновлённого archive.txt на GitHub
        if: always()
        run: |
          git config user.name "BUBATUBE Auto-Updater"
          git config user.email "actions@github.com"
          git add archive.txt
          git diff --staged --quiet || (git commit -m "Auto-update archive.txt" && git pull --rebase origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}")
